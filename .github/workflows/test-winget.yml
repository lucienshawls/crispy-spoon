name: Winget Test
on:
  - workflow_dispatch

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: MaaAssistantArknights.MaaAssistantArknights
          max-versions-to-keep: 0
          token: ${{ secrets.WINGET_TOKEN }}
