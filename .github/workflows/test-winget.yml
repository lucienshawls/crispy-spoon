name: Winget Test
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. "v1.0.0")'
        type: string
        required: true
      publish:
        description: "Switch on"
        type: boolean
        default: false

env:
  TAG: ${{ github.event.inputs.release_tag }}

jobs:
  publish:
    runs-on: windows-latest
    if: ${{ github.event.inputs.publish }}
    steps:
      - name: Trim leading v
        id: trim_version
        run: |
          $VERSION = ${{ env.TAG }} -replace '^v', ''
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
      - name: Show version
        env:
          VERSION: ${{ steps.trim_version.outputs.VERSION }}
        run: echo "Version is $env:VERSION"
