name: Winget Test
on:
  - workflow_dispatch
jobs:
  winget_test:
    name: Test Winget
    runs-on: windows-latest
    steps:
      - name: Show winget version
        run: |
          winget --version
      - name: Install komac
        run: |
          winget install komac --accept-source-agreements --accept-package-agreements

      - name: Verify komac installation
        run: |
          komac --version
